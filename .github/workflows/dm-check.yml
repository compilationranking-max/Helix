name: Helix DM checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dm-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Node syntax checks
        run: |
          node --check app.js
          node --check server.js
          node --check routes/dm.js
          node --check dm/dm.js
          node --check dm/dm-state.js
          node --check dm/dm-api.js
          node --check dm/dm-render.js
          node --check dm/dm-actions.js
      - name: Git whitespace check
        run: git diff --check HEAD^ HEAD
      - name: Install dependencies
        run: npm ci
      - name: DM runtime tests
        run: npm test
      - name: DM architecture assertions
        run: |
          node <<'NODE'
          const fs = require('fs');
          const active = ['dm/dm.js','dm/dm-state.js','dm/dm-api.js','dm/dm-render.js','dm/dm-actions.js','routes/dm.js'];
          const forbidden = /helix_messages|activeReplyToId|activeReplyTarget|replyPreviewStore|\/api\/dm\/media-message/;
          for (const file of active) {
            if (forbidden.test(fs.readFileSync(file, 'utf8'))) throw new Error(`Forbidden legacy DM reference in ${file}`);
          }
          const contracts = {
            'routes/dm.js': [
              'reply_to_id',
              'validateReplyTarget',
              'replyPreview',
              'media_data',
              'media_kind',
              'MAX_MEDIA_BYTES',
              'router.get("/media/:messageId"'
            ],
            'dm/dm-render.js': [
              'renderReplyReference',
              'dm-reply-reference',
              'dm-message-media',
              'renderContextMenu',
              'renderInfoPanel',
              'function scrollToBottom(',
              'scrollToBottom,'
            ],
            'dm/dm-state.js': [
              'state.reply',
              'pendingAttachment',
              'contextMenu',
              'infoPanelOpen',
              'conversationFilter'
            ],
            'dm/dm-api.js': [
              'sendMediaMessage',
              'getMessage',
              'getConversationInfo',
              'getNotifications'
            ],
            'dm/dm-actions.js': [
              'dm-new-message-button',
              'dm-conversation-filter',
              'function startNewMessage()',
              'function handleConversationFilter('
            ]
          };

          for (const [file, tokens] of Object.entries(contracts)) {
            const text = fs.readFileSync(file, 'utf8');
            for (const token of tokens) {
              if (!text.includes(token)) {
                throw new Error(`Missing contract ${token} in ${file}`);
              }
            }
          }

          const renderExports = new Set([
            'renderAll',
            'renderConversationList',
            'renderHeader',
            'renderMessages',
            'renderMessageStatus',
            'renderPinnedPanel',
            'renderForwardPanel',
            'renderInfoPanel',
            'renderMediaViewer',
            'renderContextMenu',
            'renderComposerState',
            'renderEmojiPicker',
            'filterEmojiPicker',
            'renderReplyReference',
            'renderMessage',
            'renderReactionStrip',
            'findMessage',
            'previewText',
            'formatFileSize',
            'scrollToBottom',
            'scrollToMessage'
          ]);

          const apiExports = new Set([
            'getConversations',
            'getMessages',
            'getMessage',
            'getPins',
            'getConversationInfo',
            'getNotifications',
            'setNickname',
            'sendMessage',
            'sendMediaMessage',
            'editMessage',
            'deleteMessage',
            'setReaction',
            'setPin',
            'forwardMessage'
          ]);

          const renderSource = fs.readFileSync('dm/dm-render.js', 'utf8');
          const actionSource = fs.readFileSync('dm/dm-actions.js', 'utf8');
          const apiSource = fs.readFileSync('dm/dm-api.js', 'utf8');

          const renderExportText = renderSource.slice(
            renderSource.indexOf('window.HelixDMRender = {')
          );
          const apiExportText = apiSource.slice(
            apiSource.indexOf('window.HelixDMApi = {')
          );

          for (const name of renderExports) {
            if (!renderExportText.includes(name)) {
              throw new Error(`dm-render.js does not export expected HelixDMRender.${name}`);
            }
          }

          for (const name of apiExports) {
            if (!apiExportText.includes(name)) {
              throw new Error(`dm-api.js does not export expected HelixDMApi.${name}`);
            }
          }

          const renderCalls = [
            ...actionSource.matchAll(/\brender\.([A-Za-z_$][\w$]*)\s*(?:\?\.)?\s*\(/g)
          ].map((match) => match[1]);

          const apiCalls = [
            ...actionSource.matchAll(/\bapi\.([A-Za-z_$][\w$]*)\s*(?:\?\.)?\s*\(/g)
          ].map((match) => match[1]);

          for (const name of new Set(renderCalls)) {
            if (!renderExports.has(name)) {
              throw new Error(`dm-actions.js calls missing HelixDMRender.${name}()`);
            }
          }

          for (const name of new Set(apiCalls)) {
            if (!apiExports.has(name)) {
              throw new Error(`dm-actions.js calls missing HelixDMApi.${name}()`);
            }
          }

          const html = fs.readFileSync('app.html', 'utf8');
          for (const required of [
            'id="dm-new-message-button"',
            'data-dm-conversation-filter="all"',
            'data-dm-conversation-filter="unread"',
            'data-dm-conversation-filter="requests"'
          ]) {
            if (!html.includes(required)) {
              throw new Error(`Missing DM UI contract: ${required}`);
            }
          }

          const mediaRoute = fs.readFileSync('routes/dm.js', 'utf8');
          const mediaRouteBlock = mediaRoute.slice(
            mediaRoute.indexOf('router.get("/media/:messageId"')
          );
          if (
            !mediaRouteBlock.includes('SELECT sender_username, recipient_username')
          ) {
            throw new Error('DM media route must select sender/recipient for authorization.');
          }

          console.log('Helix DM architecture and module API assertions passed.');
          NODE